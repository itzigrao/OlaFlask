{% extends 'base.html' %}

{% block title %}Início{% endblock %}

{% block content %}

<main>
    <div class="container">
        <h2>Bem-vindo, CRUD de objetivos profissionais e pessoais é aqui!</h2>
    </div>
    <section class="container">

        <form class="form-goal" id="formGoal">
        
            <h2>Formulário para listar Objetivos</h2>

            <label for="goalTitulo">Titulo do objetivo: </label>
            <input type="text" id="goalTitulo" name="Titulo" placeholder="Digite o título do objetivo" required><br>

            <label for="goalDescricao">Descrição: </label>
            <input class="descricao-area" type="text" id="goalDescricao" name="Descricao" placeholder="Descrição para exemplificar o objetivo" required><br>
 
            <button class="btn" type="submit">Criar</button><br>
            <p id="goalMessage"></p>

        </form>

        
            
    </section>
    <div>

        {% if current_user.is_authenticated %}
        <h2>Lista de objetivos: </h2>
        <ul class="list-goals" id="listGoals"></ul>
        <p id="listgoalMessage"></p> 
        {% endif %}
    </div>

</main>


{% endblock %}
