{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<main>
    <div class="container">

        <form id="loginForm">
            
            <h2>Formulário de Login</h2>

            <label for="loginEmail">Email: </label>
            <input type="email" id="loginEmail" name="email" placeholder="Digite seu email" required><br>

            <label for="loginSenha">Senha: </label>
            <input type="password" id="loginSenha" name="senha" placeholder="Digite sua senha"><br>

            <button class="btn" type="submit">Entrar</button><br>
            <p id="loginMessage" role="status"></p>
        </form>
        
        
        
        
    </div>
</main>



{% endblock %}
